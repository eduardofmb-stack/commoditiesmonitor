name: Coleta diária de preços
on:
  schedule:
    - cron: "30 9 * * 2-6"   # 06h30 de Brasília, de terça a sábado
  workflow_dispatch:
permissions:
  contents: write
jobs:
  coletar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python coletar.py
      - run: |
          git config user.name "coleta-automatica"
          git config user.email "coleta@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Coleta $(date -u +%F)"
          git push
